# Optional: Render.com Blueprint (https://render.com)
# After connecting this repo, Render can read this file or you can set the same in the dashboard.
services:
  - type: web
    name: cva-resume
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_NO_SANDBOX
        value: true
    # Set in the Render dashboard (never commit real values):
    # JWT_SECRET, OPENROUTER_API_KEY (or other AI keys), OPENROUTER_HTTP_REFERER = your public URL
