# Optional: Render.com Blueprint (https://render.com/docs/infrastructure-as-code)
# New Blueprint → connect repo → Render reads this file.
services:
  - type: web
    name: cva-resume
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_NO_SANDBOX
        value: "true"
    # Add in dashboard after first deploy (do not commit secrets):
    # JWT_SECRET, OPENROUTER_API_KEY, OPENROUTER_MODEL, OPENROUTER_HTTP_REFERER (your https URL), etc.
