<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — AI Resume Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <main class="page">
      <section class="card profile-card-wide">
        <header class="header">
          <div class="header-row">
            <a class="app-logo" href="./index.html" aria-label="AI Resume Studio — Home">
              <span class="app-logo-mark" aria-hidden="true"></span>
              <span class="app-logo-text">Resume<span class="app-logo-accent">AI</span></span>
            </a>
            <div id="accountMount" class="account-mount hidden"></div>
          </div>
          <p class="chip">Your profile</p>
          <h1>Profile</h1>
          <p class="subtitle">Your account email and saved contact details. Generated resumes are listed below.</p>
        </header>

        <div class="profile-identity">
          <p class="profile-identity-label">Signed in as</p>
          <p id="profileEmail" class="profile-email">—</p>
        </div>

        <section class="profile-cvs" aria-labelledby="profileCvHeading">
          <h2 id="profileCvHeading" class="profile-section-title">Your generated resumes</h2>
          <ul id="profileCvList" class="profile-cv-list"></ul>
          <p id="profileCvEmpty" class="profile-cv-empty hidden">
            No resumes yet. Go to Home and generate your first tailored CV.
          </p>
        </section>

        <form id="profileForm" class="profile-form profile-contact-form" autocomplete="on">
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" maxlength="40" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="linkedinUrl">LinkedIn URL</label>
            <input
              id="linkedinUrl"
              name="linkedinUrl"
              type="text"
              inputmode="url"
              maxlength="500"
              placeholder="https://linkedin.com/in/your-profile"
            />
          </div>
          <button type="submit" class="generate-btn">
            <span class="btn-text">Save contact details</span>
            <span class="btn-glow"></span>
          </button>
        </form>

        <p id="profileStatus" class="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="./js/account-menu.js" defer></script>
    <script src="./js/profile-ui.js" defer></script>
  </body>
</html>
